[project]
name = "tennis-diary-server"
version = "1.0.0"
description = "Tennis Diary 微信小程序后台服务"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.10.3",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.18",
    "httpx>=0.28.1",
    "aiofiles>=24.1.0",
    "Pillow>=11.0.0",
    "loguru>=0.7.2",
    "python-dotenv>=1.0.1",
    "alembic>=1.19.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
# Alembic 自动生成的迁移脚本保持原样，不做格式化
exclude = ["alembic/versions/*", "alembic/env.py", "alembic/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "PIE", "RUF"]
ignore = [
    "B008",                # FastAPI Depends() 在参数默认值中是惯用法
    "RUF001", "RUF002", "RUF003",  # 中文全角标点（，。：（））在中文文档/日志/注释中属正常用法
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
# Alembic 自动生成的迁移脚本：不强制行宽、导入排序、Python 版本现代化改写
"alembic/versions/*" = ["E501", "I", "UP"]
