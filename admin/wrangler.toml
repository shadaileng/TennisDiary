# Admin 管理端 Cloudflare Workers 部署配置
# 部署：cd admin && pnpm build && npx wrangler deploy
# CI：仓库 .github/workflows/deploy-admin-workers.yml
name = "tennis-diary-admin"
compatibility_date = "2024-01-01"

# Vite 构建产物静态托管：使用 Pages/Assets 托管模式
# SPA fallback 由 Cloudflare 自动处理（not_found_handling = "single-page-application"）
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# 说明：
# - API 网关由独立 Worker tennis-diary-proxy（proxy/）承担，此处仅托管静态资源 dist/。
# - 使用 Pages/Assets 托管（非自定义 Worker），简化部署并避免 SPA 路由问题。
# - VITE_API_BASE_URL 在构建期内联，部署前请在 admin/.env 或 CI Variables 中配置。
# - 生产建议绑定已备案自定义域名，大陆访问更稳定（*.workers.dev 大陆不稳定）。
