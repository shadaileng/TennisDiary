name: Test Server

on:
  push:
    branches: [dev, master]
    paths:
      - 'server/**'
      - '.github/workflows/test-server.yml'
  pull_request:
    branches: [dev, master]
    paths:
      - 'server/**'
      - '.github/workflows/test-server.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global core.autocrlf false
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --no-install-project

      - name: Install application (for tests)
        run: uv pip install -e .

      - name: Prepare test environment
        run: cp .env.test.example .env.test

      - name: Lint & format check
        run: |
          uv run ruff check . || true
          uv run ruff format --check . || true

      - name: Run fast tests (parallel)
        run: uv run pytest -x -v -n auto -m fast --tb=short --stop

      - name: Run critical integration tests
        run: uv run pytest -x -v -n 2 -m "not fast" --tb=short --maxfail=5  # 限制失败数量
        env:
          CI: true
