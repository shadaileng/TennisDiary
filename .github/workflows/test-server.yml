name: Test Server

on:
  push:
    branches: [dev, master]
    paths:
      - 'server/**'
      - '.github/workflows/test-server.yml'
  pull_request:
    branches: [dev, master]
    paths:
      - 'server/**'
      - '.github/workflows/test-server.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 增加超时时间以避免集成测试超时
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --no-install-project

      - name: Prepare test environment
        run: cp .env.test.example .env.test

      - name: Lint & format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run fast tests (parallel)
        run: uv run pytest -v -n auto -m fast --tb=short

      - name: Run critical integration tests (with timeout)
        # 单步骤超时保护
        run: uv run pytest -v -n 2 -m "not fast" --tb=short --maxfail=10  # 限制并行度和失败数量
        env:
          CI: true
