name: Deploy Server to HuggingFace Spaces

# ⛔ 已禁用：HF Space 免费 Docker 档需 PRO 订阅（HTTP 402），无法免费部署。
# 启用方法：取消下方 on 触发分、删除上方禁用说明。部署已切换为魔搭/OCI 方案。
# on:
#   push:
#     branches: [master]
#     paths:
#       - 'server/**'
#       - '.github/workflows/deploy-server-hf.yml'
#   workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to HuggingFace Spaces
        run: bash server/scripts/deploy-hf.sh
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ github.event.inputs.space_name || secrets.HF_SPACE_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_SECRET: ${{ secrets.WX_SECRET }}
          ADMIN_DEFAULT_PASSWORD: ${{ secrets.ADMIN_DEFAULT_PASSWORD }}
