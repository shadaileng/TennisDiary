name: Test Server

on:
  push:
    branches: [dev, master]
    paths:
      - 'server/**'
      - '.github/workflows/test-server.yml'
  pull_request:
    branches: [dev, master]
    paths:
      - 'server/**'
      - '.github/workflows/test-server.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Configure test environment
        run: |
          cp .env.test.example .env.test
          mkdir -p data_test uploads data_test logs

      - name: Run fast tests
        run: uv run pytest -m fast -v --tb=short -n auto --maxfail=10
        env:
          CI: true
